<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>성인 중증천식 진료 가이드라인 — 사이트 프로토타입 v2.3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap');
/* ── Theme: "Clinical Evergreen" (custom · theme-factory)
   Forest Canopy(ivory·forest green) × Botanical Garden(fern·marigold·terracotta)를
   KQ 분석표 PDF의 인쇄 아이덴티티(딥그린+크림+세리프)에 정렬한 합성 테마.
   차트 마크 색은 dataviz validate_palette.js 통과값: #21835f / #c77400 / #b03a37 ── */
:root{
  --paper:#faf9f6; --surface:#ffffff; --soft:#f3f1ec;
  --ink:#1c1b18; --ink2:#57544c; --ink3:#8d8a80;
  --line:#e5e2da; --line2:#cfccc2;
  --green:#1e5b46; --green2:#2e7d5f; --green-soft:#e9f1ed; --green-line:#c4d8cf;
  --sage:#7d8471; --fern:#4a7c59;
  --mark:#21835f; --mcid:#c77400;
  --amber:#a8730f; --amber-bg:#faf1dd;
  --red:#b03a37; --red-bg:#f9e9e8; --gray-bg:#efedea;
  --shadow:0 1px 2px rgba(28,27,24,.05), 0 6px 18px rgba(28,27,24,.05);
  --shadow-lift:0 3px 6px rgba(28,27,24,.06), 0 12px 28px rgba(28,27,24,.09);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
  font-size:14.5px;line-height:1.7;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,.serif{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;letter-spacing:-.02em}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2.5px solid var(--green2);outline-offset:2px;border-radius:4px}
a{color:var(--green);text-decoration:none}
a:hover{text-decoration:underline}

/* layout */
.layout{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
.sidebar{background:var(--surface);border-right:1px solid var(--line);padding:20px 0 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
.main{min-width:0}
.content{max-width:880px;margin:0 auto;padding:36px 40px 90px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}.content{padding:24px 18px 60px}}

/* sidebar */
.brand{padding:0 22px 16px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand .t1{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--green);text-transform:uppercase}
.brand .t2{font-size:16.5px;font-weight:700;line-height:1.35;margin-top:4px}
.brand .t3{font-size:11px;color:var(--ink3);margin-top:6px}
.navgrp{padding:10px 14px 4px}
.navgrp .g{font-size:10.5px;font-weight:700;letter-spacing:.09em;color:var(--ink3);text-transform:uppercase;padding:6px 8px 4px}
.navgrp a{display:block;padding:6px 10px;border-radius:7px;color:var(--ink2);font-size:13px;line-height:1.45}
.navgrp a:hover{background:var(--soft);text-decoration:none;color:var(--ink)}
.navgrp a.on{background:var(--green-soft);color:var(--green);font-weight:700}
.navgrp a .mini{font-size:10.5px;color:var(--ink3);font-weight:400}
.proto{margin:16px 22px 0;padding:10px 12px;background:var(--amber-bg);border:1px solid #e5cf9e;border-radius:8px;font-size:11px;color:#7a5a10;line-height:1.5}

/* common */
.crumb{font-size:11.5px;color:var(--ink3);margin-bottom:14px}
.crumb b{color:var(--green);font-weight:700}
h1.page{font-size:29px;line-height:1.3;margin:0 0 10px;font-weight:700}
.page-en{font-size:13px;color:var(--ink3);margin:0 0 18px}
h2.sec{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--green);text-transform:uppercase;margin:40px 0 6px;border:none}
h2.sec+h3.sect{margin-top:0}
h3.sect{font-size:20px;margin:0 0 14px;font-weight:700}
h4{font-size:14.5px;margin:20px 0 8px}
p{margin:0 0 12px;max-width:76ch}
ul,ol{margin:0 0 12px;padding-left:20px;max-width:76ch}
li{margin-bottom:5px}
.muted{color:var(--ink3);font-size:12.5px}
.small{font-size:12.5px}
hr.rule{border:none;border-top:1px solid var(--line);margin:34px 0}

/* badges */
.b{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;line-height:1.7;white-space:nowrap;border:1px solid transparent}
.b-ev{background:var(--green-soft);color:var(--green);border-color:var(--green-line)}
.b-grade{background:#fff;border-color:var(--green);color:var(--green)}
.b-none{background:var(--red-bg);color:var(--red);border-color:#e4b7b5}
.b-plan{background:var(--amber-bg);color:var(--amber);border-color:#e5cf9e}
.b-draft{background:var(--amber-bg);color:var(--amber);border-color:#e5cf9e}
.b-ok{background:var(--green-soft);color:var(--green2);border-color:var(--green-line)}
.b-hold{background:var(--gray-bg);color:var(--ink2);border-color:var(--line2)}
.b-warn2{background:var(--amber-bg);color:var(--amber);border-color:#e5cf9e}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;box-shadow:var(--shadow);margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:13px;margin:16px 0}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px;margin:16px 0}
.rec-quote{border-left:4px solid var(--green);background:var(--surface);padding:20px 24px;border-radius:0 12px 12px 0;box-shadow:var(--shadow);margin:16px 0}
.rec-quote .txt{font-family:"Noto Serif KR",Georgia,serif;font-size:17.5px;line-height:1.65;font-weight:600}
.rec-quote .txt em{color:var(--green);font-style:normal}
.badge-bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.badge-bar .cell{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:8px 16px;min-width:118px}
.badge-bar .k{font-size:10.5px;color:var(--ink3);font-weight:700;letter-spacing:.05em}
.badge-bar .v{font-size:14.5px;font-weight:700;margin-top:2px}
.badge-bar .v.gr{color:var(--green)}
.notice{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:13px 17px;font-size:12.5px;color:var(--ink2);margin:16px 0}
.notice b{color:var(--ink)}
.callout-g{background:var(--green-soft);border:1px solid var(--green-line);border-radius:10px;padding:14px 18px;font-size:13px;margin:16px 0}
.callout-g b{color:var(--green)}
.placeholder{border:1.5px dashed var(--line2);border-radius:10px;padding:16px 18px;background:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(0,0,0,.014) 6px,rgba(0,0,0,.014) 12px);color:var(--ink2);font-size:12.5px;margin:14px 0}
.placeholder b{color:var(--ink)}

/* tables */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);margin:14px 0}
table{border-collapse:collapse;width:100%;font-size:12.8px;min-width:520px}
th,td{padding:9px 13px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
thead th{background:var(--soft);font-size:10.8px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);font-weight:700;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fbfaf7}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dots{font-size:12px;letter-spacing:.05em;white-space:nowrap}
.mcid-met{color:var(--green);font-weight:700}
.mcid-not{color:var(--ink3);font-weight:600}
.harm{color:var(--red);font-weight:700}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px 18px;box-shadow:var(--shadow)}
.stat .k{font-size:11px;color:var(--ink3);font-weight:700}
.stat .v{font-size:24px;font-weight:700;color:var(--green);font-family:Georgia,serif}
.stat .s{font-size:11px;color:var(--ink3)}

/* KQ cards on home/summary */
.kq-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);display:block;color:var(--ink)}
.kq-card:hover{border-color:var(--green-line);text-decoration:none}
.kq-card .no{font-size:10.5px;font-weight:700;color:var(--green);letter-spacing:.08em}
.kq-card .nm{font-size:16px;font-weight:700;margin:2px 0 6px;font-family:"Noto Serif KR",Georgia,serif}
.kq-card .ph{font-size:11.5px;color:var(--ink3);margin-bottom:8px;min-height:17px}
.kq-card .bd{display:flex;gap:6px;flex-wrap:wrap}

/* timeline */
.tl{border-left:2px solid var(--green-line);margin:18px 0 18px 8px;padding-left:22px}
.tl .ev{position:relative;padding-bottom:20px}
.tl .ev::before{content:"";position:absolute;left:-28.5px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--green);border:2px solid var(--paper)}
.tl .ev.pend::before{background:var(--paper);border:2px solid var(--line2)}
.tl .d{font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.04em}
.tl .t{font-size:14.5px;font-weight:700;margin:1px 0 3px}
.tl .s{font-size:12.5px;color:var(--ink2);max-width:66ch}

/* tools */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px}
.field .hint{font-size:11.5px;color:var(--ink3);font-weight:400}
input[type=number]{width:130px;padding:7px 10px;border:1px solid var(--line2);border-radius:8px;font-size:13.5px;font-family:inherit;background:#fff}
input[type=number]:focus{outline:2px solid var(--green-line);border-color:var(--green2)}
.inrow{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.chk{display:flex;gap:9px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);margin-bottom:8px;cursor:pointer;font-size:13px}
.chk:hover{border-color:var(--green-line)}
.chk input{margin-top:3px;accent-color:var(--green)}
.btn{display:inline-block;background:var(--green);color:#fff;border:none;border-radius:9px;padding:10px 22px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--green2)}
.btn.ghost{background:var(--surface);color:var(--green);border:1.5px solid var(--green)}
.btn.sm{padding:7px 14px;font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:7px 16px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink2);font-family:inherit}
.seg button.on{background:var(--green);color:#fff}
.result-ok{color:var(--green);font-weight:700}
.result-no{color:var(--red);font-weight:700}
.result-na{color:var(--ink3);font-weight:600}

/* filter chips */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink2);font-family:inherit}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}

/* footer */
.pfoot{border-top:1px solid var(--line);margin-top:56px;padding-top:16px;font-size:11.5px;color:var(--ink3);line-height:1.75}

/* hero */
.hero{background:linear-gradient(150deg,var(--surface) 55%,var(--green-soft));border:1px solid var(--line);border-radius:16px;padding:38px 40px;box-shadow:var(--shadow);margin-bottom:26px}
.hero h1{font-size:31px;line-height:1.32;margin:8px 0 12px}
.hero .sub{font-size:14px;color:var(--ink2);max-width:64ch}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 8px}
.cta a{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);color:var(--ink)}
.cta a:hover{border-color:var(--green-line);text-decoration:none}
.cta .t{font-weight:700;font-size:15px;color:var(--green)}
.cta .s{font-size:12px;color:var(--ink2);margin-top:3px}
.anchor-nav{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 8px}
.anchor-nav a{font-size:11.5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;color:var(--ink2)}
.anchor-nav a:hover{color:var(--green);border-color:var(--green-line);text-decoration:none}
.person-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:14px 0}
.person{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.person .ava{width:52px;height:52px;border-radius:50%;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;margin:0 auto 8px;font-family:Georgia,serif}
.person .nm{font-weight:700;font-size:14px}
.person .rl{font-size:11.5px;color:var(--green);font-weight:700}
.person .og{font-size:11.5px;color:var(--ink3)}

/* ── v2.0 design update ── */
.card,.kq-card,.cta a,.stat,.person{transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease}
.kq-card:hover,.cta a:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
h2.sec{position:relative;padding-left:14px}
h2.sec::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:4px;border-radius:2px;background:var(--green)}
.rec-quote{box-shadow:var(--shadow-lift)}
.hero{position:relative;overflow:hidden}
.hero::after{content:"⊕⊕⊕⊕";position:absolute;right:-14px;bottom:-34px;font-size:120px;letter-spacing:-6px;color:var(--green);opacity:.045;pointer-events:none;font-family:Georgia,serif}

/* effect chart — null · MCID 이중 임계 시각화 */
.fx{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px 18px 6px;margin:14px 0}
.fx-legend{display:flex;gap:13px;flex-wrap:wrap;font-size:10.8px;color:var(--ink2);padding:9px 4px 10px;border-bottom:1px solid var(--line)}
.fx-legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.fx-row{display:grid;grid-template-columns:minmax(148px,196px) minmax(210px,1fr) 108px 128px;gap:14px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.fx-row:last-child{border-bottom:none}
.fx-row:hover{background:#fbfaf7}
.fx-lbl b{font-size:12.3px;line-height:1.4;display:block}
.fx-lbl span{display:block;font-size:10.5px;color:var(--ink3);margin-top:2px}
.fx-svg{width:100%;height:46px;display:block}
.fx-dir{font-size:8.5px;fill:var(--ink3)}
.fx-val{text-align:right;font-variant-numeric:tabular-nums;font-size:12.8px;white-space:nowrap}
.fx-val span{display:block;font-size:11px;color:var(--ink3)}
.fx-tag{font-size:11px;line-height:2}
.fx-alt{margin:8px 0 14px}
.fx-alt summary{font-size:12px;color:var(--ink2);cursor:pointer}
@media(max-width:760px){.fx-row{grid-template-columns:1fr;gap:5px}.fx-val{text-align:left}}

/* patient-voice bars (단일 색상 시리즈) */
.pv{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px 20px;margin:14px 0}
.pv-row{display:grid;grid-template-columns:minmax(170px,250px) 1fr 96px;gap:12px;align-items:center;padding:7px 0}
.pv-l{font-size:12.3px;color:var(--ink2);line-height:1.4}
.pv-t{background:var(--soft);border-radius:0 4px 4px 0;height:16px;position:relative}
.pv-f{background:var(--mark);height:100%;border-radius:0 4px 4px 0;min-width:2px}
.pv-v{font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pv-foot{font-size:11px;color:var(--ink3);border-top:1px solid var(--line);padding-top:10px;margin-top:8px}
@media(max-width:640px){.pv-row{grid-template-columns:1fr;gap:4px}}

/* OPTIMAL 감량 단계 — ordinal 단일 색상 램프 + 라벨 */
.opt-bar{display:flex;gap:2px;height:26px;border-radius:7px;overflow:hidden;margin:12px 0 6px}
.opt-bar div{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff;min-width:0}
.opt-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink2);margin-bottom:8px}
.opt-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ── Decision Support 도구 UI (v2.3 고도화) ── */
.tool-lede{display:flex;gap:15px;align-items:flex-start;background:linear-gradient(135deg,var(--green-soft) 0%,#fff 70%);border:1px solid var(--green-line);border-radius:14px;padding:17px 21px;margin:4px 0 22px;box-shadow:var(--shadow)}
.tool-lede .ic{flex:0 0 auto;width:42px;height:42px;border-radius:12px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.tool-lede .tl-t{font-weight:700;font-size:14px;margin-bottom:2px}
.tool-lede .tl-s{font-size:12.3px;color:var(--ink2);line-height:1.6}
.stepcard{position:relative;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--green-line);border-radius:12px;padding:16px 20px 12px;margin:0 0 13px;box-shadow:var(--shadow)}
.stepcard .sc-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.stepcard .sc-n{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--green-soft);color:var(--green);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--green-line)}
.stepcard .sc-t{font-weight:700;font-size:15px;font-family:"Noto Serif KR",Georgia,serif}
.stepcard .sc-b{margin-left:auto}
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:14px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 15px 11px;box-shadow:var(--shadow);border-top:3px solid var(--line2)}
.tile.ok{border-top-color:var(--mark)} .tile.no{border-top-color:var(--red)} .tile.na{border-top-color:var(--line2)}
.tile .t-k{font-size:11.3px;font-weight:700;color:var(--ink2);line-height:1.45;min-height:32px}
.tile .t-v{font-size:16.5px;font-weight:700;margin:6px 0 2px;font-family:Georgia,"Noto Serif KR",serif}
.tile.ok .t-v{color:var(--mark)} .tile.no .t-v{color:var(--red)} .tile.na .t-v{color:var(--ink3)}
.tile .t-s{font-size:11.3px;color:var(--ink3)}
.tile .t-c{font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--ink3)}
.sumchips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.sumchips .sc{font-size:12.3px;font-weight:700;border-radius:999px;padding:4px 14px;border:1px solid var(--line);background:var(--surface)}
.sumchips .sc.ok{background:var(--green-soft);color:var(--green);border-color:var(--green-line)}
.sumchips .sc.no{background:var(--red-bg);color:var(--red);border-color:#e4b7b5}
.sumchips .sc.na{background:var(--gray-bg);color:var(--ink2)}
.pathsel{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:14px 0 20px}
.pathsel button{cursor:pointer;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:15px 18px;box-shadow:var(--shadow);font-family:inherit;color:var(--ink);transition:border-color .15s,background .15s}
.pathsel button:hover{border-color:var(--green-line)}
.pathsel button.on{border-color:var(--green);background:linear-gradient(135deg,var(--green-soft) 0%,#fff 75%)}
.pathsel .p-k{font-size:10.5px;font-weight:700;letter-spacing:.09em;color:var(--green);text-transform:uppercase}
.pathsel .p-t{font-size:15.5px;font-weight:700;font-family:"Noto Serif KR",Georgia,serif;margin:3px 0 4px}
